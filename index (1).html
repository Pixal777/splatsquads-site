<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Splat Squads</title>
<style>
  html,body{margin:0;height:100%;background:#141826;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  form{background:#1f2537;border:2px solid #33405f;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center}
  h1{margin:0 0 6px;font-size:30px;font-weight:900;letter-spacing:1px;background:linear-gradient(90deg,#ff8a1c,#ffd21c 50%,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
  p{margin:0 0 18px;color:#aeb7cf;font-size:14px}
  input[type=password]{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:2px solid #3a4666;background:#121624;color:#fff;font-size:16px;outline:none}
  input[type=password]:focus{border-color:#ff8a1c}
  label{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0 16px;color:#aeb7cf;font-size:14px}
  button{width:100%;padding:12px;border:0;border-radius:10px;background:#ff8a1c;color:#fff;font-weight:800;font-size:17px;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:#ff7b7b;font-size:14px;min-height:20px;margin-top:10px}
</style></head>
<body><div class="wrap"><form id="f">
  <h1>SPLAT SQUADS</h1>
  <p>Enter the password to play.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <label><input id="rem" type="checkbox" checked> Remember this device</label>
  <button id="go" type="submit">PLAY</button>
  <div class="err" id="err"></div>
</form></div>
<script>
(() => {
  const SALT = "XMuXcYNvdtGa/M3/1ygWYQ==", WRAPPED = "OCKmjo9rUGv+UI+0LgstVLGpkJHxPjWY5sLnNJW0+YkXKkmCCWk714rB2SHdEVBwkpN+0Tcr9PwjDjXB", ITER = 310000;
  const STORE = "splat-site-kek", KEY_STORE = "splat-site-key";
  const un = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const bs = (u) => { let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
  const open = async (key, buf) => new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12)));
  const err = document.getElementById("err"), go = document.getElementById("go");
  const gamePromise = fetch("game.bin", { cache: "no-cache" }).then((r) => { if (!r.ok) throw new Error("download"); return r.arrayBuffer(); });

  async function unlock(kekRaw) {
    const kek = await crypto.subtle.importKey("raw", kekRaw, "AES-GCM", false, ["decrypt"]);
    const raw = await open(kek, un(WRAPPED));
    const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const html = new TextDecoder().decode(await open(key, new Uint8Array(await gamePromise)));
    const k64 = bs(raw);
    sessionStorage.setItem(KEY_STORE, k64);
    window.__SPLAT_CONTENT_KEY = k64;
    document.open(); document.write(html); document.close();
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: un(SALT), iterations: ITER }, base, 256));
  }
  // Remembered devices skip the form (if the password changed, it just asks again).
  let saved = null;
  try { saved = localStorage.getItem(STORE) || sessionStorage.getItem(STORE); } catch (e) {}
  if (saved) unlock(un(saved)).catch(() => { try { localStorage.removeItem(STORE); sessionStorage.removeItem(STORE); } catch (e) {} });

  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "UNLOCKING…";
    try {
      const kek = await derive(document.getElementById("pw").value);
      try { (document.getElementById("rem").checked ? localStorage : sessionStorage).setItem(STORE, bs(kek)); } catch (e) {}
      await unlock(kek);
    } catch (x) {
      try { localStorage.removeItem(STORE); sessionStorage.removeItem(STORE); } catch (e) {}
      err.textContent = x && x.message === "download" ? "Couldn't download the game. Check your connection." : "Wrong password.";
      go.disabled = false; go.textContent = "PLAY";
    }
  });
})();
</script></body></html>
